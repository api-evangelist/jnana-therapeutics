aid: jnana-therapeutics
name: Jnana Therapeutics
description: >-
  Jnana Therapeutics Inc. is a biotechnology company headquartered at One Design Center Place,
  Suite 19-400, Boston, Massachusetts, that built RAPID — Reactive Affinity Probe Interaction
  Discovery — a next-generation chemoproteomics platform for discovering small-molecule medicines
  against target classes that conventional screening has struggled to drug, including SLC
  transporters, transcription factors, signaling scaffold proteins, phosphatases, GPCRs and
  helicases. RAPID runs in living cells: a proprietary Reactive Affinity Probe library covalently
  labels druggable pockets on a validated target, and a proprietary detection technology then
  screens large drug-like compound libraries for binders that displace the probe, yielding allosteric
  inhibitors, localization modulators and molecular glues without iterative structural biology. Its
  internal pipeline focuses on phenylketonuria (PKU) — where JNT-517, an oral inhibitor acting at a
  cryptic allosteric site on the SLC6A19 transporter, reached Phase 1b/2 — and on immune-mediated
  diseases including targets such as interferon regulatory factor 3 (IRF3), alongside biopharma
  collaborations that include Roche. Otsuka Pharmaceutical Co., Ltd. completed its acquisition of
  Jnana on 23 September 2024 for $800 million plus up to $325 million in development and regulatory
  milestones, making Jnana a direct subsidiary of Otsuka America, Inc.; Otsuka initiated a global
  Phase 3 trial of repinatrabit in PKU in December 2025. Jnana Therapeutics runs no developer
  program and publishes no product API, developer portal, API reference or SDK. The only
  machine-readable surface reachable without credentials is the WordPress REST content API behind
  www.jnanatx.com, catalogued here.
