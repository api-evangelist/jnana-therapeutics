apis:
- aid: jnana-therapeutics:jnana-therapeutics-content-api
  name: Jnana Therapeutics Content API
  description: >-
    The read-only WordPress REST content surface behind www.jnanatx.com — news posts (62), corporate
    pages (9), media (376), post categories (7), the `team` custom post type (9 profiles) and its
    `team-department` taxonomy (4 terms), cross-content search, oEmbed 1.0, Yoast SEO head metadata
    and Genesis theme documents. Verified anonymously reachable on 2026-08-23; an OPTIONS preflight
    returns `allow: GET`, and every write and administrative route answers 401/403/404 without
    credentials. Jnana publishes no OpenAPI or API reference for this surface — the OpenAPI here is
    an API Evangelist derivation of the live route index, and humanURL points at the upstream
    WordPress REST handbook that defines the wp/v2 contract.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://www.jnanatx.com/wp-json
